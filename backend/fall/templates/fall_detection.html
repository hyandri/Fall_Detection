<!DOCTYPE html>
<html>
<head>
    <title>Fall Detection System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .video-container {
            padding: 20px;
            text-align: center;
        }
        .video-stream {
            max-width: 100%;
            border: 3px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .status {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
            text-align: center;
        }
        .status.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status.info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .detection-info {
            background-color: #f8f9fa;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid #007bff;
        }
        .fall-detected {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚨 Fall Detection System</h1>
            <p>Automatic fall detection with real-time monitoring</p>
        </div>
        
        <div class="video-container">
            <div id="loading" class="loading">
                <h3>🔄 Starting webcam and fall detection...</h3>
                <p>Please wait while the system initializes</p>
            </div>
            
            <div id="videoContainer" style="display: none;">
                <img id="videoStream" class="video-stream" src="" alt="Fall Detection Stream">
            </div>
            
            <div id="status" class="status info">Initializing...</div>
            
            <div id="detectionInfo" class="detection-info" style="display: none;">
                <strong>Detection Status:</strong> <span id="detectionStatus">Starting...</span><br>
                <strong>Detections:</strong> <span id="detectionCount">0</span><br>
                <strong>Last Update:</strong> <span id="lastUpdate">-</span><br>
                <strong>Alert System:</strong> <span id="alertStatus">Active</span><br>
                <strong>Alerts Sent:</strong> <span id="alertCount">0</span>
            </div>
        </div>
    </div>

    <script>
        let isInitialized = false;
        let detectionInterval;

        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }

        function updateDetectionInfo(status, count, timestamp) {
            document.getElementById('detectionStatus').textContent = status;
            document.getElementById('detectionCount').textContent = count;
            document.getElementById('lastUpdate').textContent = new Date(timestamp * 1000).toLocaleTimeString();
        }

        function updateAlertInfo() {
            fetch('/alerts/status/')
            .then(response => response.json())
            .then(data => {
                document.getElementById('alertStatus').textContent = data.alert_enabled ? 'Active' : 'Disabled';
                document.getElementById('alertCount').textContent = data.alert_count;
            })
            .catch(error => {
                console.error('Error fetching alert status:', error);
            });
        }

        function showVideo() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('videoContainer').style.display = 'block';
            document.getElementById('detectionInfo').style.display = 'block';
        }

        function initializeSystem() {
            // Start webcam
            fetch('/webcam/start/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': getCookie('csrftoken'),
                    'Content-Type': 'application/json',
                },
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    updateStatus('Webcam started successfully!', 'success');
                    
                    // Enable detection immediately
                    return fetch('/detection/enable/', {
                        method: 'POST',
                        headers: {
                            'X-CSRFToken': getCookie('csrftoken'),
                            'Content-Type': 'application/json',
                        },
                    });
                } else {
                    throw new Error(data.message);
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    updateStatus('Fall detection enabled! System is ready.', 'success');
                    showVideo();
                    startVideoStream();
                    startDetectionMonitoring();
                    updateAlertInfo(); // Load initial alert status
                    isInitialized = true;
                } else {
                    throw new Error(data.message);
                }
            })
            .catch(error => {
                updateStatus(`Error: ${error.message}`, 'error');
                console.error('Initialization error:', error);
            });
        }

        function startVideoStream() {
            // Start the video stream
            document.getElementById('videoStream').src = '/stream/video/';
        }

        function startDetectionMonitoring() {
            detectionInterval = setInterval(updateDetectionResults, 1000); // Update every second
            // Also update alert info periodically
            setInterval(updateAlertInfo, 5000); // Update every 5 seconds
        }

        function updateDetectionResults() {
            if (!isInitialized) return;
            
            fetch('/detection/status/')
            .then(response => response.json())
            .then(data => {
                const detectionCount = data.detection_count;
                const fallDetected = data.fall_detected;
                
                let status = 'Active';
                if (fallDetected) {
                    status = '🚨 FALL DETECTED!';
                    document.getElementById('detectionInfo').classList.add('fall-detected');
                } else {
                    document.getElementById('detectionInfo').classList.remove('fall-detected');
                }
                
                updateDetectionInfo(status, detectionCount, Date.now() / 1000);
            })
            .catch(error => {
                console.error('Error fetching detection results:', error);
            });
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // Initialize system on page load
        window.onload = function() {
            updateStatus('Starting fall detection system...', 'info');
            initializeSystem();
        };

        // Cleanup on page unload
        window.onbeforeunload = function() {
            if (detectionInterval) {
                clearInterval(detectionInterval);
            }
        };
    </script>
</body>
</html>
