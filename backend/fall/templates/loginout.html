{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - InsureWise</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="/static/styles.css" rel="stylesheet">
</head>
<body class="bg-[#E0E2E4] min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div>
    {% if messages %}
      <div style="margin-bottom: 1rem;">
        {% for message in messages %}
          <p style="
              padding: 0.5rem 1rem;
              margin-bottom: 0.5rem;
              border-radius: 0.5rem;
              color: white;
              background-color:#acb27a
            ">
            !   {{ message }}   ! 
          </p>
        {% endfor %}
      </div>
    {% endif %}
  </div>
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-lg shadow-md">
    <div>
      <h2 class="text-center text-3xl font-bold text-gray-900">Welcome back</h2>
      <p class="mt-2 text-center text-sm text-gray-600">Sign in to your account</p>
    </div>

    <form action="loginout" method="POST" class="mt-8 space-y-6">
      {% csrf_token %}
      <div class="space-y-4">
        <div>
          <input
            name="email"
            type="email"
            autocomplete="email"
            required
            placeholder="Email address"
            class="appearance-none rounded-lg relative block w-full px-4 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
          />
        </div>
        <div>
          <input
            name="password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="Password"
            class="appearance-none rounded-lg relative block w-full px-4 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
          />
        </div>
      </div>

      <div class="flex items-center justify-between">
        <div class="text-sm">
          <a href="#" class="font-medium text-blue-600 hover:text-blue-500">Forgot your password?</a>
        </div>
      </div>

      <div>
        <button
          type="submit"
          class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition-colors font-medium"
        >
          Log In
        </button>
      </div>

      <div class="text-center">
        <p class="text-sm text-gray-600">
          Don't have an account?
          <a href="{% url 'signup' %}" class="font-medium text-blue-600 hover:text-blue-500 ml-1">Sign up</a>
        </p>
      </div>
    </form>
  </div>
</body>
</html>
